name: guides_nepal
description: >-
  Guides Nepal — discover Nepal through local eyes. A travel discovery and
  booking app connecting independent travelers with local guides across
  Kathmandu, Pokhara, Lalitpur, Bhaktapur and Bharatpur.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^18.1.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  intl: any
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
